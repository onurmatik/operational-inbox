  <script>
    document.addEventListener("submit", (event) => {
      const form = event.target.closest("[data-domain-retry-form], [data-outbound-enable-form]");
      if (!form) return;
      if (form.getAttribute("aria-busy") === "true") {
        event.preventDefault();
        return;
      }
      form.setAttribute("aria-busy", "true");
      const button = form.querySelector("button");
      button.disabled = true;
      button.textContent = form.dataset.busyLabel || "Preparing test address…";
    });

    document.addEventListener("DOMContentLoaded", () => {
      const provisioningPanel = document.querySelector("[data-provisioning-poll]");
      if (!provisioningPanel) return;
      const statusText = provisioningPanel.querySelector("[data-provisioning-status]");
      const wait = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));
      const poll = async () => {
        let consecutiveErrors = 0;
        for (let attempt = 0; attempt < 72; attempt += 1) {
          await wait(attempt === 0 ? 2000 : 5000);
          try {
            const domain = await window.OperationalInbox.request(provisioningPanel.dataset.detailUrl);
            consecutiveErrors = 0;
            if (domain.status !== "PROVISIONING") {
              window.location.reload();
              return;
            }
            if (domain.error?.message) {
              statusText.textContent = domain.error.message;
            }
          } catch (error) {
            consecutiveErrors += 1;
            if (consecutiveErrors >= 3) {
              provisioningPanel.setAttribute("aria-busy", "false");
              statusText.textContent = "We couldn't refresh this status automatically. Reload the page to try again.";
              return;
            }
          }
        }
        provisioningPanel.setAttribute("aria-busy", "false");
        statusText.textContent = "Setup is still continuing in the background. You can leave this page and return later.";
      };
      poll();
    });

    document.addEventListener("DOMContentLoaded", () => {
      const provisioningPanel = document.querySelector("[data-outbound-provisioning-poll]");
      if (!provisioningPanel) return;
      const statusText = provisioningPanel.querySelector("[data-outbound-provisioning-status]");
      const poll = async () => {
        for (let attempt = 0; attempt < 72; attempt += 1) {
          await new Promise((resolve) => setTimeout(resolve, attempt === 0 ? 2000 : 5000));
          try {
            const domain = await window.OperationalInbox.request(provisioningPanel.dataset.detailUrl);
            if (domain.outbound_status !== "PROVISIONING") {
              window.location.reload();
              return;
            }
          } catch (error) {
            statusText.textContent = "Sending setup is continuing in the background. Reload to check again.";
            provisioningPanel.setAttribute("aria-busy", "false");
            return;
          }
        }
        statusText.textContent = "Sending setup is continuing in the background. You can return later.";
        provisioningPanel.setAttribute("aria-busy", "false");
      };
      poll();
    });

    document.addEventListener("DOMContentLoaded", () => {
      const transitionPanel = document.querySelector("[data-routing-transition-poll]");
      if (!transitionPanel) return;
      const initialStatus = transitionPanel.dataset.transitionStatus;
      const poll = async () => {
        let consecutiveErrors = 0;
        for (let attempt = 0; attempt < 72; attempt += 1) {
          await new Promise((resolve) => setTimeout(resolve, attempt === 0 ? 2000 : 5000));
          try {
            const domain = await window.OperationalInbox.request(transitionPanel.dataset.detailUrl);
            consecutiveErrors = 0;
            const currentStatus = domain.routing_transition?.status || "COMPLETE";
            if (currentStatus !== initialStatus) {
              window.location.reload();
              return;
            }
          } catch (error) {
            consecutiveErrors += 1;
            if (consecutiveErrors >= 3) {
              transitionPanel.setAttribute("aria-busy", "false");
              return;
            }
          }
        }
        transitionPanel.setAttribute("aria-busy", "false");
      };
      poll();
    });

    document.addEventListener("DOMContentLoaded", () => {
      const testPanel = document.querySelector("[data-inbound-test-poll]");
      if (!testPanel) return;
      const statusText = testPanel.querySelector("[data-inbound-test-status]");
      const poll = async () => {
        let consecutiveErrors = 0;
        for (let attempt = 0; attempt < 72; attempt += 1) {
          await new Promise((resolve) => setTimeout(resolve, attempt === 0 ? 2000 : 5000));
          try {
            const domain = await window.OperationalInbox.request(testPanel.dataset.detailUrl);
            consecutiveErrors = 0;
            if (domain.inbound_ready || domain.status !== "PENDING_TEST") {
              window.location.reload();
              return;
            }
          } catch (error) {
            consecutiveErrors += 1;
            if (consecutiveErrors >= 3) {
              testPanel.setAttribute("aria-busy", "false");
              statusText.textContent = "We couldn't refresh this status automatically. Reload the page to check again.";
              return;
            }
          }
        }
        testPanel.setAttribute("aria-busy", "false");
        statusText.textContent = "We're still waiting for the test email. You can reload this page or return later.";
      };
      poll();
    });

    let dnsCheckPollGeneration = 0;

    document.addEventListener("click", async (event) => {
      const copyButton = event.target.closest("[data-copy]");
      if (copyButton) {
        const element = document.querySelector(copyButton.dataset.copy);
        const originalLabel = copyButton.dataset.copyLabel || copyButton.textContent.trim();
        const originalAriaLabel = copyButton.getAttribute("aria-label");
        try {
          if (!element) {
            throw new Error("Copy source is unavailable.");
          }
          const value = element.textContent.trim();
          let copied = false;
          if (navigator.clipboard?.writeText) {
            try {
              await navigator.clipboard.writeText(value);
              copied = true;
            } catch (error) {
              copied = false;
            }
          }
          if (!copied) {
            const textarea = document.createElement("textarea");
            textarea.value = value;
            textarea.setAttribute("readonly", "");
            textarea.style.position = "fixed";
            textarea.style.opacity = "0";
            document.body.appendChild(textarea);
            try {
              textarea.select();
              copied = document.execCommand("copy");
            } finally {
              textarea.remove();
            }
          }
          if (!copied) {
            throw new Error("Clipboard access is unavailable.");
          }
          copyButton.textContent = "Copied";
          copyButton.setAttribute("aria-label", "Copied");
        } catch (error) {
          copyButton.textContent = "Copy failed";
          copyButton.setAttribute("aria-label", "Copy failed");
        }
        setTimeout(() => {
          copyButton.textContent = originalLabel;
          if (originalAriaLabel) {
            copyButton.setAttribute("aria-label", originalAriaLabel);
          } else {
            copyButton.removeAttribute("aria-label");
          }
        }, 1500);
        return;
      }

      const checkButton = event.target.closest("[data-dns-check-button]");
      if (!checkButton) return;
      const feedback = document.getElementById(checkButton.dataset.feedbackId);
      const checkButtons = document.querySelectorAll("[data-dns-check-button]");
      const showFeedback = (message, isError = false) => {
        feedback.className = `mt-5 border p-4 text-sm ${isError ? "border-coral-strong/40 bg-coral-soft text-coral-strong" : "border-blue-strong/40 bg-blue-soft text-blue-strong"}`;
        feedback.textContent = message;
      };
      const setButtonsDisabled = (disabled) => {
        checkButtons.forEach((button) => {
          button.disabled = disabled;
        });
      };
      const pollGeneration = ++dnsCheckPollGeneration;
      setButtonsDisabled(true);
      feedback.setAttribute("aria-busy", "true");
      let beforeCheck;
      try {
        beforeCheck = await window.OperationalInbox.request(checkButton.dataset.detailUrl);
        await window.OperationalInbox.request(checkButton.dataset.checkUrl, {method: "POST"});
      } catch (error) {
        showFeedback(error.message || "The DNS check could not be started.", true);
        setButtonsDisabled(false);
        feedback.setAttribute("aria-busy", "false");
        return;
      }

      setButtonsDisabled(false);
      showFeedback("DNS check queued. Background processing can take up to five minutes; this page will refresh when it completes. You can keep using this page or refresh later.");
      const initialStatus = beforeCheck.status;
      const initialCheckedAt = beforeCheck.last_checked_at || "";
      let consecutiveErrors = 0;
      for (let attempt = 0; attempt < 72; attempt += 1) {
        await new Promise((resolve) => setTimeout(resolve, 5000));
        if (pollGeneration !== dnsCheckPollGeneration) return;
        try {
          const domain = await window.OperationalInbox.request(checkButton.dataset.detailUrl);
          consecutiveErrors = 0;
          if (
            domain.status !== initialStatus ||
            (domain.last_checked_at && domain.last_checked_at !== initialCheckedAt)
          ) {
            window.location.reload();
            return;
          }
        } catch (error) {
          consecutiveErrors += 1;
          if (consecutiveErrors >= 3) {
            showFeedback("The check was queued, but its status could not be refreshed automatically. Reload this page later to see the latest result.", true);
            feedback.setAttribute("aria-busy", "false");
            return;
          }
        }
      }
      showFeedback("The check is still queued or running. Refresh this page later to see the latest result.");
      feedback.setAttribute("aria-busy", "false");
    });
  </script>
