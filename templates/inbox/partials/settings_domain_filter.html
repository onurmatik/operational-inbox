<form method="get" class="my-6 max-w-sm"><label class="oi-label" for="settings-domain">Domain</label><select id="settings-domain" name="domain" class="oi-input" data-submit-change>{% for item in nav_domains %}<option value="{{ item.id }}" {% if domain.id == item.id %}selected{% endif %}>{{ item.hostname }}</option>{% endfor %}</select><button class="sr-only">Select domain</button></form>
