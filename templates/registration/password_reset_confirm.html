{% extends "base.html" %}{% block body %}<main class="grid min-h-screen place-items-center px-4"><section class="w-full max-w-md border border-line bg-white p-8"><h1 class="font-heading text-3xl font-semibold">Choose a new password</h1>{% if validlink %}<form method="post" class="oi-form mt-6 space-y-5">{% csrf_token %}{{ form.as_p }}<button class="oi-button-primary w-full">Update password</button></form>{% else %}<p class="mt-3 text-sm text-coral-strong">This reset link is invalid or expired.</p>{% endif %}</section></main>{% endblock %}
