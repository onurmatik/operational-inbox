{% extends "base.html" %}

{% block title %}{{ title }} | Operational Inbox{% endblock %}

{% block body %}
  <header class="border-b border-line bg-white">
    <div class="mx-auto flex max-w-4xl items-center justify-between px-6 py-5">
      <a class="font-semibold text-ink" href="/">Operational Inbox</a>
      <nav class="flex gap-5 text-sm text-muted" aria-label="Public navigation">
        <a href="{% url 'mcp_docs' %}">Agent access</a>
        <a href="{% url 'support' %}">Support</a>
      </nav>
    </div>
  </header>
  <main class="mx-auto max-w-4xl px-6 py-14">
    <article class="prose prose-slate max-w-none">
      <p class="text-xs font-semibold uppercase tracking-[0.18em] text-muted">Operational Inbox</p>
      <h1 class="mt-3 text-4xl font-semibold tracking-tight">{{ title }}</h1>
      {% block public_content %}{% endblock %}
    </article>
  </main>
{% endblock %}
