[project]
name = "operational-inbox"
version = "0.1.0"
description = "A tenant-safe operational email control layer."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "argon2-cffi>=23.1,<26",
  "boto3>=1.35,<2",
  "cryptography>=43,<47",
  "django>=5.2,<5.3",
  "django-ninja>=1.4,<2",
  "django-sesame>=3.2.3,<3.3",
  "dnspython>=2.7,<3",
  "gunicorn>=23,<24",
  "nh3>=0.2.20,<1",
  "openai>=1.99,<3",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.0,<2",
  "whitenoise>=6.8,<7",
]

[dependency-groups]
dev = [
  "django-stubs[compatible-mypy]>=5.2,<6",
  "freezegun>=1.5,<2",
  "moto[s3,ses,sns,sqs]>=5.1,<6",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "pytest-django>=4.10,<5",
  "ruff>=0.11,<1",
]
infra = [
  "aws-cdk-lib>=2.200,<3",
  "constructs>=10.4,<11",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "operational_inbox.settings"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config --disable-warnings --cov=inbox --cov=operational_inbox --cov-report=term-missing:skip-covered --cov-fail-under=70"

[tool.coverage.run]
branch = true
omit = ["*/migrations/*", "*/tests/*", "manage.py"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["inbox/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DJ", "RUF", "S"]
ignore = ["DJ001", "DJ008", "DJ012", "RUF012", "S101", "UP047"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S106", "S311"]
"operational_inbox/settings.py" = ["S105"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
warn_unreachable = true
exclude = ["inbox/migrations"]

[[tool.mypy.overrides]]
module = ["inbox.admin", "inbox.api", "inbox.forms", "inbox.views"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["inbox.models"]
disable_error_code = ["assignment", "misc"]

[tool.django-stubs]
django_settings_module = "operational_inbox.settings"
